name: TFI Agent Weekly Check
on:
  schedule:
    - cron: '0 15 * * 3'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weekly-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run social agent (1 LinkedIn post)
        run: python tfi_agent.py run --social
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      - name: Run web health check
        run: python tfi_agent.py run --web
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: weekly-results
          path: |
            content/linkedin_posts/
            content/seo_data/
          retention-days: 30
