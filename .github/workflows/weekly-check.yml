name: TFI Agent Weekly Check
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run web health check
        run: python tfi_agent.py run --web
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-check
          path: content/seo_data/
          retention-days: 30
