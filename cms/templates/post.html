<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} — The Fitness Initiative</title>
    <meta name="description" content="{{meta_description}}">
    <meta property="og:title" content="{{title}}">
    <meta property="og:description" content="{{meta_description}}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{{url}}">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": "{{title}}",
        "author": {"@type": "Person", "name": "{{author}}"},
        "datePublished": "{{date}}",
        "dateModified": "{{date}}",
        "publisher": {
            "@type": "NGO",
            "name": "The Fitness Initiative",
            "url": "https://www.thefitnessinitiative.org"
        },
        "description": "{{meta_description}}",
        "mainEntityOfPage": "{{url}}"
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.7; color: #333; background: #fafafa; }
        .nav { background: #1a5c2e; color: white; padding: 15px 0; }
        .nav .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .nav a { color: white; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .nav .logo { font-weight: bold; font-size: 18px; }
        .hero { background: linear-gradient(135deg, #1a5c2e, #2a8c4e); color: white; padding: 40px 0; text-align: center; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero .meta { font-size: 14px; opacity: 0.85; }
        .content { max-width: 750px; margin: 0 auto; padding: 40px 20px; }
        .content h2 { font-size: 24px; color: #1a5c2e; margin: 30px 0 15px; }
        .content h3 { font-size: 20px; color: #1a5c2e; margin: 25px 0 12px; }
        .content p { margin-bottom: 16px; }
        .content strong { color: #1a5c2e; }
        .content ul, .content ol { margin: 0 0 16px 24px; }
        .content li { margin-bottom: 8px; }
        .content a { color: #1a73e8; text-decoration: underline; }
        .content blockquote { border-left: 4px solid #1a5c2e; padding: 12px 20px; margin: 16px 0; background: #f0f7f2; border-radius: 0 6px 6px 0; }
        .tags { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .tags span { display: inline-block; background: #e8f5e9; color: #1a5c2e; padding: 4px 12px; border-radius: 4px; font-size: 13px; margin: 3px; }
        .cta { background: #1a5c2e; color: white; text-align: center; padding: 30px; margin: 40px 0; border-radius: 8px; }
        .cta a { color: #90ee90; }
        .footer { background: #1a1a1a; color: #999; text-align: center; padding: 20px; font-size: 13px; }
        .footer a { color: #90ee90; text-decoration: none; }
        @media (max-width: 600px) { .hero h1 { font-size: 24px; } .content { padding: 20px 15px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="container">
            <span class="logo">The Fitness Initiative</span>
            <div>
                <a href="/">Home</a>
                <a href="/about.html">About</a>
                <a href="/programs.html">Programs</a>
                <a href="/blog.html">Blog</a>
                <a href="/contact.html">Contact</a>
            </div>
        </div>
    </nav>
    <div class="hero">
        <div class="container">
            <h1>{{title}}</h1>
            <p class="meta">By {{author}} | {{date}} | {{pillar}}</p>
        </div>
    </div>
    <div class="content">
        {{content}}
        <div class="tags">
            {{tags}}
        </div>
        <div class="cta">
            <p>Ready to take the next step? <a href="/programs.html">Explore our programs</a> or <a href="/contact.html">contact us</a> to get involved.</p>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2025 The Fitness Initiative. A Rochester, NY nonprofit. | <a href="https://www.thefitnessinitiative.org">thefitnessinitiative.org</a></p>
    </footer>
</body>
</html>
