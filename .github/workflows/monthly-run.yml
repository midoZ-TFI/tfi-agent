name: TFI Agent Monthly Run
on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-extra.txt
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Run SEO, content, research, web agents
        run: python tfi_agent.py run --seo --content --research --web
      - name: Generate report
        run: python tfi_agent.py report
      - name: Deploy content to TFI site
        run: python tfi_agent.py deploy
        env:
          TFI_REPO_TOKEN: ${{ secrets.TFI_REPO_TOKEN }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: monthly-report
          path: reports/monthly/
          retention-days: 90
